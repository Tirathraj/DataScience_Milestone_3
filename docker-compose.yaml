# docker-compose.yml
# version: '3' (obsolete)

#### IMPORTANT ####
# command to run BEFORE docker-compose up:
# $env:WANDB_API_KEY="your_wandb_api_key_here"  (in PowerShell)

services:
  serving:
    build:
      context: ./
      dockerfile: ./Dockerfile.serving
    image: ift6758/serving:latest
    ports:
      - 8080:8080
    environment:
      WANDB_API_KEY: ${WANDB_API_KEY}
###### Uncomment below when you're ready to add the final notebook container to your docker compose
  streamlit:
    build:
      context: ./
      dockerfile: ./Dockerfile.streamlit
    image: ift6758/streamlit:latest
    ports:
      - 8501:8501
    environment:
      SERVING_HOST: serving
      SERVING_PORT: 8080

      

     
