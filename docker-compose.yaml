# docker-compose.yml
# version: '3' (obsolete)

#### IMPORTANT ####
# command to run BEFORE docker-compose up:
# $env:WANDB_API_KEY="your_wandb_api_key_here"  (in PowerShell)

services:
  serving:
    build:
      context: ./
      dockerfile: ./Dockerfile.serving
    image: ift6758/serving:latest
    ports:
      - 8080:8080
    environment:
      WANDB_API_KEY: ${WANDB_API_KEY}
